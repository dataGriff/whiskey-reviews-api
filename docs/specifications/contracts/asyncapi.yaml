asyncapi: 2.6.0
info:
  title: Whiskey Reviews Domain Events
  version: 1.0.0
  description: |
    Domain event contract for the **Whiskey Reviews** API.

    All events follow the [CloudEvents 1.0](https://cloudevents.io/) specification
    and are published over AMQP.
  contact:
    name: Whiskey Reviews API
    email: admin@whiskeyreviews.example.com

servers:
  development:
    url: amqp://localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker

defaultContentType: application/json

tags:
  - name: Reviews
    description: Events related to the whiskey review lifecycle

channels:
  reviews.review.added:
    description: Published whenever a new whiskey review is added by a reviewer.
    publish:
      operationId: onReviewAdded
      description: Consume review added events to react to new reviews being published.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewAdded'

  reviews.review.edited:
    description: Published whenever a review's details or status are changed.
    publish:
      operationId: onReviewEdited
      description: Consume review edited events to keep downstream systems in sync with review changes.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewEdited'

  reviews.review.removed:
    description: Published whenever a review is removed by its reviewer.
    publish:
      operationId: onReviewRemoved
      description: Consume review removed events to remove references to reviews in downstream systems.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewRemoved'

components:
  messages:
    ReviewAdded:
      name: ReviewAdded
      title: Review Added
      summary: A new whiskey review has been added.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewAddedEvent'
      examples:
        - name: review-added-example
          payload:
            specversion: "1.0"
            type: reviews.review.added
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000001
            time: "2026-06-01T09:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000002
              whiskeyName: Glenfiddich 12
              distillery: Glenfiddich
              region: Speyside
              age: 12
              rating: 85
              tastingNotes: Fruity with hints of pear and oak
              status: published
              reviewerId: a1b2c3d4-0000-0000-0000-000000000003
              createdAt: "2026-06-01T09:00:00Z"
              updatedAt: "2026-06-01T09:00:00Z"

    ReviewEdited:
      name: ReviewEdited
      title: Review Edited
      summary: An existing whiskey review has been edited.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewEditedEvent'
      examples:
        - name: review-edited-example
          payload:
            specversion: "1.0"
            type: reviews.review.edited
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000004
            time: "2026-06-02T10:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000002
              whiskeyName: Glenfiddich 12
              distillery: Glenfiddich
              region: Speyside
              age: 12
              rating: 88
              tastingNotes: Refined fruitiness with a longer finish
              status: archived
              reviewerId: a1b2c3d4-0000-0000-0000-000000000003
              createdAt: "2026-06-01T09:00:00Z"
              updatedAt: "2026-06-02T10:00:00Z"

    ReviewRemoved:
      name: ReviewRemoved
      title: Review Removed
      summary: A whiskey review has been removed.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewRemovedEvent'
      examples:
        - name: review-removed-example
          payload:
            specversion: "1.0"
            type: reviews.review.removed
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000005
            time: "2026-06-03T11:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000002
              reviewerId: a1b2c3d4-0000-0000-0000-000000000003
              removedAt: "2026-06-03T11:00:00Z"

  schemas:
    CloudEventBase:
      type: object
      required: [specversion, type, source, id, time, datacontenttype]
      properties:
        specversion:
          type: string
          const: "1.0"
        type:
          type: string
          description: Event type in reverse-DNS dot notation
        source:
          type: string
          description: URI reference for the event source
        id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json

    ReviewData:
      type: object
      required: [id, whiskeyName, distillery, region, age, rating, tastingNotes, status, reviewerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        whiskeyName:
          type: string
        distillery:
          type: string
        region:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 100
        tastingNotes:
          type: string
          nullable: true
        status:
          type: string
          enum: [published, archived]
        reviewerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewAddedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReviewData'

    ReviewEditedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReviewData'

    ReviewRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, reviewerId, removedAt]
              properties:
                id:
                  type: string
                  format: uuid
                reviewerId:
                  type: string
                  format: uuid
                removedAt:
                  type: string
                  format: date-time
