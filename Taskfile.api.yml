version: '3'

vars:
  BASE_URL: http://localhost:3000/v1
  STATE: .demo-state

tasks:

  # ---------------------------------------------------------------------------
  # STATE MANAGEMENT
  # ---------------------------------------------------------------------------

  state:clear:
    desc: Clear all saved demo state (tokens, IDs)
    cmds:
      - rm -f {{.STATE}}
      - touch {{.STATE}}
      - echo "DEMO_ID=$(date +%s)" >> {{.STATE}}
      - echo "Demo state cleared."

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------

  auth:register:reviewer:
    desc: Register a reviewer (saves REVIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"reviewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Alice\",
            \"lastName\": \"Reviewer\",
            \"role\": \"reviewer\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^REVIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:register:viewer:
    desc: Register a viewer (saves VIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"viewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Bob\",
            \"lastName\": \"Viewer\",
            \"role\": \"viewer\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^VIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "VIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:login:reviewer:
    desc: Login as reviewer (saves REVIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/login \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"reviewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^REVIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:logout:
    desc: Logout (invalidate the reviewer session)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X POST {{.BASE_URL}}/auth/logout \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}"
        echo "Logged out."

  # ---------------------------------------------------------------------------
  # REVIEWS
  # ---------------------------------------------------------------------------

  reviews:list:
    desc: List all whiskey reviews (uses REVIEWER_TOKEN)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  reviews:create:
    desc: Add a new whiskey review (saves REVIEW_ID)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/reviews \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" \
          -d "{
            \"whiskeyName\": \"Demo Dram {{.DEMO_ID}}\",
            \"distillery\": \"Glen Demo\",
            \"region\": \"Speyside\",
            \"age\": 12,
            \"rating\": 85,
            \"tastingNotes\": \"A demo review with fruity notes and a smooth finish.\"
          }")
        echo "$RESPONSE" | jq .
        REVIEW_ID=$(echo "$RESPONSE" | jq -r '.id')
        grep -v "^REVIEW_ID=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEW_ID=$REVIEW_ID" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  reviews:get:
    desc: Get the demo review by ID
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  reviews:update:
    desc: Edit the demo review (archive it)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X PATCH {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" \
          -d '{"status": "archived"}' | jq .

  reviews:delete:
    desc: Remove the demo review
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
          {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}")
        echo "DELETE /reviews/{{.REVIEW_ID}} → HTTP $STATUS"

  reviews:list:viewer:
    desc: List reviews as a viewer (demonstrates read-only access)
    vars:
      VIEWER_TOKEN:
        sh: grep '^VIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews \
          -H "Authorization: Bearer {{.VIEWER_TOKEN}}" | jq .

  reviews:create:viewer:
    desc: Attempt to add a review as a viewer (expects 403 Forbidden)
    vars:
      VIEWER_TOKEN:
        sh: grep '^VIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        echo "Attempting to add as viewer (should be 403):"
        curl -s -X POST {{.BASE_URL}}/reviews \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.VIEWER_TOKEN}}" \
          -d '{"whiskeyName": "Forbidden Dram", "distillery": "Forbidden Distillery", "rating": 70}' | jq .

  # ---------------------------------------------------------------------------
  # DEMO WORKFLOW
  # ---------------------------------------------------------------------------

  demo:
    desc: Run the full end-to-end demo workflow
    cmds:
      - task: state:clear
      - echo ""
      - echo "=== 1. Register reviewer and viewer ==="
      - task: auth:register:reviewer
      - task: auth:register:viewer
      - echo ""
      - echo "=== 2. Reviewer adds a whiskey review ==="
      - task: reviews:create
      - echo ""
      - echo "=== 3. List reviews (reviewer view) ==="
      - task: reviews:list
      - echo ""
      - echo "=== 4. Viewer lists reviews (read-only) ==="
      - task: reviews:list:viewer
      - echo ""
      - echo "=== 5. Viewer tries to add a review (expect 403) ==="
      - task: reviews:create:viewer
      - echo ""
      - echo "=== 6. Get specific review ==="
      - task: reviews:get
      - echo ""
      - echo "=== 7. Edit review (archive it) ==="
      - task: reviews:update
      - echo ""
      - echo "=== 8. Remove review ==="
      - task: reviews:delete
      - echo ""
      - echo "=== Demo complete ==="
