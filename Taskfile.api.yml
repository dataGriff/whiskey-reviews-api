version: '3'

vars:
  BASE_URL: http://localhost:3000/v1
  STATE: .demo-state

tasks:

  # ---------------------------------------------------------------------------
  # STATE MANAGEMENT
  # ---------------------------------------------------------------------------

  state:clear:
    desc: Clear all saved demo state (tokens, IDs)
    cmds:
      - rm -f {{.STATE}}
      - touch {{.STATE}}
      - echo "DEMO_ID=$(date +%s)" >> {{.STATE}}
      - echo "Demo state cleared."

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------

  auth:register:admin:
    desc: Register a whiskey admin (saves ADMIN_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"admin.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Charlie\",
            \"lastName\": \"Admin\",
            \"role\": \"admin\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^ADMIN_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "ADMIN_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:register:reviewer:
    desc: Register a reviewer (saves REVIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"reviewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Alice\",
            \"lastName\": \"Reviewer\",
            \"role\": \"reviewer\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^REVIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:register:viewer:
    desc: Register a viewer (saves VIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/register \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"viewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\",
            \"firstName\": \"Bob\",
            \"lastName\": \"Viewer\",
            \"role\": \"viewer\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^VIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "VIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:login:reviewer:
    desc: Login as reviewer (saves REVIEWER_TOKEN)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/auth/login \
          -H "Content-Type: application/json" \
          -d "{
            \"email\": \"reviewer.{{.DEMO_ID}}@example.com\",
            \"password\": \"password123\"
          }")
        echo "$RESPONSE" | jq .
        TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken')
        grep -v "^REVIEWER_TOKEN=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEWER_TOKEN=$TOKEN" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  auth:logout:
    desc: Logout (invalidate the reviewer session)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X POST {{.BASE_URL}}/auth/logout \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}"
        echo "Logged out."

  # ---------------------------------------------------------------------------
  # WHISKIES (admin managed)
  # ---------------------------------------------------------------------------

  whiskies:list:
    desc: List all whiskies in the inventory (uses REVIEWER_TOKEN)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/whiskies \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  whiskies:create:
    desc: Add a new whiskey to the inventory as admin (saves WHISKEY_ID)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      ADMIN_TOKEN:
        sh: grep '^ADMIN_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/whiskies \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.ADMIN_TOKEN}}" \
          -d "{
            \"name\": \"Demo Dram {{.DEMO_ID}}\",
            \"distillery\": \"Glen Demo\",
            \"region\": \"Speyside\",
            \"age\": 12,
            \"description\": \"A demo whiskey added during the demo run.\"
          }")
        echo "$RESPONSE" | jq .
        WHISKEY_ID=$(echo "$RESPONSE" | jq -r '.id')
        grep -v "^WHISKEY_ID=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "WHISKEY_ID=$WHISKEY_ID" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  whiskies:get:
    desc: Get the demo whiskey by ID
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      WHISKEY_ID:
        sh: grep '^WHISKEY_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/whiskies/{{.WHISKEY_ID}} \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  whiskies:update:
    desc: Edit the demo whiskey as admin
    vars:
      ADMIN_TOKEN:
        sh: grep '^ADMIN_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      WHISKEY_ID:
        sh: grep '^WHISKEY_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X PATCH {{.BASE_URL}}/whiskies/{{.WHISKEY_ID}} \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.ADMIN_TOKEN}}" \
          -d '{"description": "Updated description from the demo run."}' | jq .

  whiskies:delete:
    desc: Remove the demo whiskey from the inventory
    vars:
      ADMIN_TOKEN:
        sh: grep '^ADMIN_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      WHISKEY_ID:
        sh: grep '^WHISKEY_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
          {{.BASE_URL}}/whiskies/{{.WHISKEY_ID}} \
          -H "Authorization: Bearer {{.ADMIN_TOKEN}}")
        echo "DELETE /whiskies/{{.WHISKEY_ID}} → HTTP $STATUS"

  whiskies:create:reviewer:
    desc: Attempt to add a whiskey as a reviewer (expects 403 Forbidden)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        echo "Attempting to add whiskey as reviewer (should be 403):"
        curl -s -X POST {{.BASE_URL}}/whiskies \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.ADMIN_TOKEN}}" \
          -d '{"name": "Forbidden Dram", "distillery": "Forbidden Distillery"}' | jq .

  # ---------------------------------------------------------------------------
  # REVIEWS
  # ---------------------------------------------------------------------------

  reviews:list:
    desc: List all whiskey reviews (uses REVIEWER_TOKEN)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  reviews:create:
    desc: Add a new whiskey review (saves REVIEW_ID)
    vars:
      DEMO_ID:
        sh: grep '^DEMO_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      WHISKEY_ID:
        sh: grep '^WHISKEY_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        RESPONSE=$(curl -s -X POST {{.BASE_URL}}/reviews \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" \
          -d "{
            \"whiskeyId\": \"{{.WHISKEY_ID}}\",
            \"rating\": 85,
            \"tastingNotes\": \"A demo review with fruity notes and a smooth finish.\"
          }")
        echo "$RESPONSE" | jq .
        REVIEW_ID=$(echo "$RESPONSE" | jq -r '.id')
        grep -v "^REVIEW_ID=" {{.STATE}} > {{.STATE}}.tmp 2>/dev/null || true
        echo "REVIEW_ID=$REVIEW_ID" >> {{.STATE}}.tmp
        mv {{.STATE}}.tmp {{.STATE}}

  reviews:get:
    desc: Get the demo review by ID
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" | jq .

  reviews:update:
    desc: Edit the demo review (archive it)
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X PATCH {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}" \
          -d '{"status": "archived"}' | jq .

  reviews:delete:
    desc: Remove the demo review
    vars:
      REVIEWER_TOKEN:
        sh: grep '^REVIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      REVIEW_ID:
        sh: grep '^REVIEW_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
          {{.BASE_URL}}/reviews/{{.REVIEW_ID}} \
          -H "Authorization: Bearer {{.REVIEWER_TOKEN}}")
        echo "DELETE /reviews/{{.REVIEW_ID}} → HTTP $STATUS"

  reviews:list:viewer:
    desc: List reviews as a viewer (demonstrates read-only access)
    vars:
      VIEWER_TOKEN:
        sh: grep '^VIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        curl -s -X GET {{.BASE_URL}}/reviews \
          -H "Authorization: Bearer {{.VIEWER_TOKEN}}" | jq .

  reviews:create:viewer:
    desc: Attempt to add a review as a viewer (expects 403 Forbidden)
    vars:
      VIEWER_TOKEN:
        sh: grep '^VIEWER_TOKEN=' {{.STATE}} 2>/dev/null | cut -d= -f2-
      WHISKEY_ID:
        sh: grep '^WHISKEY_ID=' {{.STATE}} 2>/dev/null | cut -d= -f2-
    cmds:
      - |
        echo "Attempting to add review as viewer (should be 403):"
        curl -s -X POST {{.BASE_URL}}/reviews \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{.VIEWER_TOKEN}}" \
          -d "{\"whiskeyId\": \"{{.WHISKEY_ID}}\", \"rating\": 70}" | jq .

  # ---------------------------------------------------------------------------
  # DEMO WORKFLOW
  # ---------------------------------------------------------------------------

  demo:
    desc: Run the full end-to-end demo workflow
    cmds:
      - task: state:clear
      - echo ""
      - echo "=== 1. Register admin, reviewer and viewer ==="
      - task: auth:register:admin
      - task: auth:register:reviewer
      - task: auth:register:viewer
      - echo ""
      - echo "=== 2. Admin adds a whiskey to the inventory ==="
      - task: whiskies:create
      - echo ""
      - echo "=== 3. List whiskies (reviewer view) ==="
      - task: whiskies:list
      - echo ""
      - echo "=== 4. Reviewer tries to add a whiskey (expect 403) ==="
      - task: whiskies:create:reviewer
      - echo ""
      - echo "=== 5. Reviewer adds a review for the whiskey ==="
      - task: reviews:create
      - echo ""
      - echo "=== 6. List reviews (reviewer view) ==="
      - task: reviews:list
      - echo ""
      - echo "=== 7. Viewer lists reviews (read-only) ==="
      - task: reviews:list:viewer
      - echo ""
      - echo "=== 8. Viewer tries to add a review (expect 403) ==="
      - task: reviews:create:viewer
      - echo ""
      - echo "=== 9. Get specific whiskey ==="
      - task: whiskies:get
      - echo ""
      - echo "=== 10. Edit whiskey (admin) ==="
      - task: whiskies:update
      - echo ""
      - echo "=== 11. Get specific review ==="
      - task: reviews:get
      - echo ""
      - echo "=== 12. Edit review (archive it) ==="
      - task: reviews:update
      - echo ""
      - echo "=== 13. Remove review ==="
      - task: reviews:delete
      - echo ""
      - echo "=== 14. Remove whiskey ==="
      - task: whiskies:delete
      - echo ""
      - echo "=== Demo complete ==="
