asyncapi: 2.6.0
info:
  title: Whiskey Reviews Domain Events
  version: 1.0.0
  description: |
    Domain event contract for the **Whiskey Reviews** API.

    All events follow the [CloudEvents 1.0](https://cloudevents.io/) specification
    and are published over AMQP.
  contact:
    name: Whiskey Reviews API
    email: admin@whiskeyreviews.example.com

servers:
  development:
    url: amqp://localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker

defaultContentType: application/json

tags:
  - name: Whiskies
    description: Events related to the whiskey inventory lifecycle
  - name: Reviews
    description: Events related to the whiskey review lifecycle

channels:
  whiskies.whiskey.added:
    description: Published whenever a new whiskey is added to the inventory by an admin.
    publish:
      operationId: onWhiskeyAdded
      description: Consume whiskey added events to react to new whiskies entering the inventory.
      tags:
        - name: Whiskies
      message:
        $ref: '#/components/messages/WhiskeyAdded'

  whiskies.whiskey.edited:
    description: Published whenever a whiskey's details are changed by an admin.
    publish:
      operationId: onWhiskeyEdited
      description: Consume whiskey edited events to keep downstream systems in sync with inventory changes.
      tags:
        - name: Whiskies
      message:
        $ref: '#/components/messages/WhiskeyEdited'

  whiskies.whiskey.removed:
    description: Published whenever a whiskey is removed from the inventory by an admin.
    publish:
      operationId: onWhiskeyRemoved
      description: Consume whiskey removed events to remove references to whiskies in downstream systems.
      tags:
        - name: Whiskies
      message:
        $ref: '#/components/messages/WhiskeyRemoved'

  reviews.review.added:
    description: Published whenever a new whiskey review is added by a reviewer.
    publish:
      operationId: onReviewAdded
      description: Consume review added events to react to new reviews being published.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewAdded'

  reviews.review.edited:
    description: Published whenever a review's details or status are changed.
    publish:
      operationId: onReviewEdited
      description: Consume review edited events to keep downstream systems in sync with review changes.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewEdited'

  reviews.review.removed:
    description: Published whenever a review is removed by its reviewer.
    publish:
      operationId: onReviewRemoved
      description: Consume review removed events to remove references to reviews in downstream systems.
      tags:
        - name: Reviews
      message:
        $ref: '#/components/messages/ReviewRemoved'

components:
  messages:
    WhiskeyAdded:
      name: WhiskeyAdded
      title: Whiskey Added
      summary: A new whiskey has been added to the inventory.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WhiskeyAddedEvent'
      examples:
        - name: whiskey-added-example
          payload:
            specversion: "1.0"
            type: whiskies.whiskey.added
            source: /whiskies
            id: a1b2c3d4-0000-0000-0000-000000000001
            time: "2026-06-01T09:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000010
              name: Laphroaig 10
              distillery: Laphroaig
              region: Islay
              age: 10
              description: Classic Islay single malt with heavy peat smoke.
              createdAt: "2026-06-01T09:00:00Z"
              updatedAt: "2026-06-01T09:00:00Z"

    WhiskeyEdited:
      name: WhiskeyEdited
      title: Whiskey Edited
      summary: An existing whiskey has been edited.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WhiskeyEditedEvent'
      examples:
        - name: whiskey-edited-example
          payload:
            specversion: "1.0"
            type: whiskies.whiskey.edited
            source: /whiskies
            id: a1b2c3d4-0000-0000-0000-000000000002
            time: "2026-06-02T10:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000010
              name: Laphroaig 10
              distillery: Laphroaig
              region: Islay
              age: 10
              description: Updated description with more detail.
              createdAt: "2026-06-01T09:00:00Z"
              updatedAt: "2026-06-02T10:00:00Z"

    WhiskeyRemoved:
      name: WhiskeyRemoved
      title: Whiskey Removed
      summary: A whiskey has been removed from the inventory.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WhiskeyRemovedEvent'
      examples:
        - name: whiskey-removed-example
          payload:
            specversion: "1.0"
            type: whiskies.whiskey.removed
            source: /whiskies
            id: a1b2c3d4-0000-0000-0000-000000000003
            time: "2026-06-03T11:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000010
              removedAt: "2026-06-03T11:00:00Z"

    ReviewAdded:
      name: ReviewAdded
      title: Review Added
      summary: A new whiskey review has been added.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewAddedEvent'
      examples:
        - name: review-added-example
          payload:
            specversion: "1.0"
            type: reviews.review.added
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000004
            time: "2026-06-01T10:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000020
              whiskeyId: a1b2c3d4-0000-0000-0000-000000000010
              rating: 90
              tastingNotes: Smoky and peaty with a long finish.
              status: published
              reviewerId: a1b2c3d4-0000-0000-0000-000000000030
              createdAt: "2026-06-01T10:00:00Z"
              updatedAt: "2026-06-01T10:00:00Z"

    ReviewEdited:
      name: ReviewEdited
      title: Review Edited
      summary: An existing whiskey review has been edited.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewEditedEvent'
      examples:
        - name: review-edited-example
          payload:
            specversion: "1.0"
            type: reviews.review.edited
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000005
            time: "2026-06-02T11:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000020
              whiskeyId: a1b2c3d4-0000-0000-0000-000000000010
              rating: 92
              tastingNotes: Refined smokiness with a longer, sweeter finish.
              status: archived
              reviewerId: a1b2c3d4-0000-0000-0000-000000000030
              createdAt: "2026-06-01T10:00:00Z"
              updatedAt: "2026-06-02T11:00:00Z"

    ReviewRemoved:
      name: ReviewRemoved
      title: Review Removed
      summary: A whiskey review has been removed.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviewRemovedEvent'
      examples:
        - name: review-removed-example
          payload:
            specversion: "1.0"
            type: reviews.review.removed
            source: /reviews
            id: a1b2c3d4-0000-0000-0000-000000000006
            time: "2026-06-03T12:00:00Z"
            datacontenttype: application/json
            data:
              id: a1b2c3d4-0000-0000-0000-000000000020
              reviewerId: a1b2c3d4-0000-0000-0000-000000000030
              removedAt: "2026-06-03T12:00:00Z"

  schemas:
    CloudEventBase:
      type: object
      required: [specversion, type, source, id, time, datacontenttype]
      properties:
        specversion:
          type: string
          const: "1.0"
        type:
          type: string
          description: Event type in reverse-DNS dot notation
        source:
          type: string
          description: URI reference for the event source
        id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json

    WhiskeyData:
      type: object
      required: [id, name, distillery, region, age, description, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        distillery:
          type: string
        region:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WhiskeyAddedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WhiskeyData'

    WhiskeyEditedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WhiskeyData'

    WhiskeyRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, removedAt]
              properties:
                id:
                  type: string
                  format: uuid
                removedAt:
                  type: string
                  format: date-time

    ReviewData:
      type: object
      required: [id, whiskeyId, rating, tastingNotes, status, reviewerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        whiskeyId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 100
        tastingNotes:
          type: string
          nullable: true
        status:
          type: string
          enum: [published, archived]
        reviewerId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReviewAddedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReviewData'

    ReviewEditedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReviewData'

    ReviewRemovedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventBase'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id, reviewerId, removedAt]
              properties:
                id:
                  type: string
                  format: uuid
                reviewerId:
                  type: string
                  format: uuid
                removedAt:
                  type: string
                  format: date-time
